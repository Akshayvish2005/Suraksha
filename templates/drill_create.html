{% extends "base.html" %}{% block title %}Create Drill · Suraksha{% endblock %}{% block content %}<div class="page-intro"><h1>Create a virtual drill</h1><p>Schedule a self-paced preparedness exercise.</p></div><form method="post" class="panel form-grid"><label>Drill title<input name="title" required maxlength="200"></label><label>Scenario<select name="scenario_id" required>{% for s in scenarios %}<option value="{{ s.id }}">{{ s.title }}</option>{% endfor %}</select></label><label>Start time<input type="datetime-local" name="start_time" required></label><label>End time<input type="datetime-local" name="end_time" required></label><label class="check"><input type="checkbox" name="campus_wide"> Campus-wide drill</label><button class="primary">Create drill</button></form>{% endblock %}
